[workspace]
resolver = "2"
members = ["crates/poker-core", "crates/solver-adapter", "crates/pokerlab-cli", "src-tauri"]
default-members = ["crates/poker-core", "crates/solver-adapter", "crates/pokerlab-cli", "src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "AGPL-3.0-or-later"



[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
sha2 = "0.10"
flate2 = "1"
hex = "0.4"
thiserror = "2"
anyhow = "1"
# Solver engine pinned to an exact commit (repository is no longer maintained and
# the API may change without a version bump). See docs/adr/0001-fundacao.md.
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }

# The solver is unusably slow without optimizations, even in dev/test builds.
[profile.dev.package.postflop-solver]
opt-level = 3
[profile.dev.package.solver-adapter]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
