[package]
name = "pokerlab-cli"
description = "Development commands: solve a spot, query/verify solutions, generate and verify packs."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pokerlab-cli"
path = "src/main.rs"

[dependencies]
poker-core = { path = "../poker-core" }
solver-adapter = { path = "../solver-adapter" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
