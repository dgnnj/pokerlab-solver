# Template do pacote inicial: NLHE cash 6-max, BTN contra BB, pote com um único raise (SRP), 100 bb.
# O board é substituído pelo gerador de pacotes (data/packs/btn_vs_bb_srp_100bb.toml).
#
# Contabilidade (fichas; 100 fichas = 1 bb), blinds 0,5/1 bb sem ante:
#   BTN abre para 2,5 bb, SB desiste (0,5 bb morto), BB paga 1,5 bb a mais.
#   Pote no flop = 2,5 + 2,5 + 0,5 = 5,5 bb (550 fichas). Stack efetivo = 100 - 2,5 = 97,5 bb (9750 fichas).
# Rake: sem rake nesta versão (referência). Ajustar `rake` quando a estrutura da sala for identificada.

id = "btn_bb_srp100"
version = 1
title = "BTN x BB, pote simples, 100 bb"
oop_position = "BB"
ip_position = "BTN"
pot_type = "SRP"
initial_street = "flop"
board = "Ks7d4c"
chips_per_bb = 100
starting_pot_chips = 550
effective_stack_chips = 9750

[preflop]
starting_stack_chips = 10000
line = "BTN abre para 2,5 bb, SB desiste, BB paga"
invested_per_player_chips = 250
dead_chips = 50
[preflop.blinds]
sb_chips = 50
bb_chips = 100
ante_chips = 0

[rake]
rate = 0.0
cap_chips = 0.0
structure = "sem rake (referência; estrutura de sala ainda não definida)"

[tree]
turn_donk = ""
river_donk = ""
add_allin_threshold = 1.5
force_allin_threshold = 0.15
merging_threshold = 0.1
# BB não lidera no flop nesta versão (só check / check-raise).
[tree.oop.flop]
bet = ""
raise = "3x"
[tree.ip.flop]
bet = "33%, 75%"
raise = "3x"
[tree.oop.turn]
bet = "75%"
raise = "3x"
[tree.ip.turn]
bet = "75%"
raise = "3x"
[tree.oop.river]
bet = "75%"
raise = "3x"
[tree.ip.river]
bet = "75%"
raise = "3x"

[oop_range]
text = "JJ:0.5,TT:0.75,99-22,AQs:0.5,AJs-A6s,A5s:0.5,A4s:0.5,A3s-A2s,KQs:0.5,KJs-K2s,QJs-Q4s,JTs-J7s,T9s-T7s,98s-96s,87s-85s,76s-75s,65s-64s,54s-53s,43s,AQo:0.75,AJo-A8o,A7o-A2o:0.5,KQo,KJo-KTo,K9o:0.5,QJo-QTo,Q9o:0.5,JTo,J9o:0.5,T9o:0.5,98o:0.3"
source = "PokerLab — range de defesa do BB contra abertura 2,5 bb do BTN (sem os 3-bets), revisão 2026-11-20"
manual_premise = true
notes = "Premissa de estudo construída manualmente; não derivada de solução pré-flop. Pesos parciais representam mãos divididas entre call e 3-bet."

[ip_range]
text = "22+,A2s+,K2s+,Q4s+,J6s+,T6s+,96s+,85s+,75s+,64s+,54s,A5o+,K9o+,Q9o+,J9o+,T9o"
source = "PokerLab — range de abertura do BTN (~43%), revisão 2026-11-20"
manual_premise = true
notes = "Premissa de estudo construída manualmente; não derivada de solução pré-flop."

[solve]
max_iterations = 1000
target_exploitability_pct = 0.5
memory_limit_mib = 12288
