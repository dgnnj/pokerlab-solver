# Template: NLHE cash 6-max, pote 3-bet: BTN abre, BB dá 3-bet, BTN paga. 100 bb.
# O board é substituído pelo gerador de pacotes (data/packs/bb_vs_btn_3bp_100bb.toml).
#
# Contabilidade (fichas; 100 fichas = 1 bb), blinds 0,5/1 bb sem ante:
#   BTN abre para 2,5 bb, SB desiste (0,5 bb morto), BB dá 3-bet para 11 bb, BTN paga 8,5 bb a mais.
#   Pote no flop = 11 + 11 + 0,5 = 22,5 bb (2250 fichas). Stack efetivo = 100 - 11 = 89 bb (8900 fichas).
#   SPR ~4. O BB é o agressor pré-flop e joga fora de posição.
# Rake: sem rake nesta versão (referência).

id = "bb_btn_3bp100"
version = 1
title = "BB x BTN, pote 3-bet, 100 bb"
oop_position = "BB"
ip_position = "BTN"
pot_type = "3BP"
preflop_aggressor = "BB"
initial_street = "flop"
board = "Ks7d4c"
chips_per_bb = 100
starting_pot_chips = 2250
effective_stack_chips = 8900

[preflop]
starting_stack_chips = 10000
line = "BTN abre para 2,5 bb, SB desiste, BB dá 3-bet para 11 bb, BTN paga"
invested_per_player_chips = 1100
dead_chips = 50
[preflop.blinds]
sb_chips = 50
bb_chips = 100
ante_chips = 0

[rake]
rate = 0.0
cap_chips = 0.0
structure = "sem rake (referência; estrutura de sala ainda não definida)"

# SPR baixo: c-bet pequeno (25% ou 50%); depois do check o BTN aposta 50%. All-in entra
# como opção quando a aposta passa de 1,5x o pote restante (add_allin_threshold).
[tree]
