# Publishes a DRAFT release for a SemVer tag (vX.Y.Z). A maintainer validates the installer,
# latest.json, signature, notes and corresponding source, then publishes the draft by hand.
#
# Required (environment "release", protected, restricted to tags v*):
#   secrets.TAURI_SIGNING_PRIVATE_KEY           production updater key (minisign, never the dev key)
#   secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   vars.UPDATER_PUBKEY                          matching public key (embedded at build time)
# Optional, once a certificate exists (Authenticode, distinct from the updater signature):
#   secrets.WINDOWS_CERTIFICATE, secrets.WINDOWS_CERTIFICATE_PASSWORD
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches Cargo.toml, package.json and tauri.conf.json
        run: node scripts/check-version.mjs --tag "${{ github.ref_name }}"
      - run: cargo test --workspace
      - name: Bundled pack integrity
        run: cargo run --release -p pokerlab-cli -- verify-pack src-tauri/resources/packs/btn-vs-bb-srp-100bb
      - name: Production update channel
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
        run: |
          test -n "$UPDATER_PUBKEY" || { echo "vars.UPDATER_PUBKEY not set"; exit 1; }
          node scripts/release-config.mjs "${{ github.repository }}" "$UPDATER_PUBKEY" > release.conf.json
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PokerLab ${{ github.ref_name }}
          releaseBody: |
            Instalador Windows 11 x64 (NSIS, por usuário). Notas: CHANGELOG.md.
            Código-fonte correspondente: tag ${{ github.ref_name }} deste repositório (AGPL-3.0-or-later).
            Recuperação manual: docs/RECUPERACAO.md.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config release.conf.json
      - name: SHA-256 of the installer (for audit and manual downloads)
        shell: bash
        run: sha256sum target/release/bundle/nsis/*.exe | tee SHA256SUMS.txt
