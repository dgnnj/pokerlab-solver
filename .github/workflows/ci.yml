# Checks for every push and pull request. No secrets, no publishing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Version coherence (Cargo, package.json, tauri.conf.json)
        run: node scripts/check-version.mjs
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (domain, real solver, trainer on bundled pack)
        run: cargo test --workspace
      - name: Bundled pack integrity
        run: cargo run --release -p pokerlab-cli -- verify-pack src-tauri/resources/packs/btn-vs-bb-srp-100bb
      - name: River PoC (solve, reload in a separate process, query)
        shell: bash
        run: |
          cargo run --release -p pokerlab-cli -- solve data/spots/river_poc.toml --out out/river_poc.solution.json --probe out/river_poc.probe.json --probe-combos AhKd,9h9d,6s5s
          cargo run --release -p pokerlab-cli -- verify-reload out/river_poc.solution.json out/river_poc.probe.json
      - name: TypeScript
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Build installer (unsigned, no updater artifacts)
        run: npx tauri build --config "{\"bundle\":{\"createUpdaterArtifacts\":false}}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-pr-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          retention-days: 7
