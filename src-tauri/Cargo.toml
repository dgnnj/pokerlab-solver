[package]
name = "pokerlab"
description = "PokerLab — treinador de poker cash game (NLHE) offline"
version = "0.3.0"
edition.workspace = true
license.workspace = true
default-run = "pokerlab"

[lib]
name = "pokerlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
poker-core = { path = "../crates/poker-core" }
solver-adapter = { path = "../crates/solver-adapter" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
url = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
